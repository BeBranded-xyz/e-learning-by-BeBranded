# CI pipeline (core/testing.mdc gates). Jobs are independent so failures are
# attributable; `gate` is the single required check. A job is added here in
# the same pull request as the suite it runs (TEST_PLAN.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  static:
    name: Format, lint, typecheck, dead code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip

  dependencies:
    name: Vulnerability audit and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Vulnerability audit (fail on high and critical)
        run: pnpm audit --audit-level=high
      - name: License allowlist
        run: pnpm check:licenses

  test:
    name: Unit, property-based, integration, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Integration tests start PostgreSQL with Testcontainers (Docker is on the runner).
      - run: pnpm test:coverage
      - name: Generated database types and bundled migrations are up to date
        run: |
          pnpm --filter @bebranded/elearning-db db:types --verify
          pnpm --filter @bebranded/elearning-db db:bundle --verify

  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: End-to-end (demo app, desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm --filter @bebranded/elearning-demo exec playwright install --with-deps chromium
      # The demo video is a synthetic test pattern generated at test time (no media in git).
      # Non-interactive with a deadline: a debconf prompt must fail the step, not hang the job.
      - name: Install ffmpeg
        timeout-minutes: 5
        env: { DEBIAN_FRONTEND: noninteractive }
        run: |
          sudo apt-get update
          sudo --preserve-env=DEBIAN_FRONTEND apt-get install -y --no-install-recommends ffmpeg
      # PostgreSQL starts with Testcontainers; the demo is already built above.
      - name: Run the journeys
        run: pnpm --filter @bebranded/elearning-demo test:e2e
        env: { E2E_SKIP_BUILD: "1" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: e2e-report, path: apps/demo/playwright-report }

  gate:
    name: All CI checks green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, dependencies, test, build, e2e]
    if: always()
    steps:
      - name: Fail if any job failed, was cancelled or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if printf '%s' "$NEEDS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            exit 1
          fi
          echo "all green"
